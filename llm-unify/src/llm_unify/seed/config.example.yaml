# llm-unify 配置文件
# 密钥通过 ${VAR} 引用环境变量（读取同目录 .env），不要把真实 Key 写进本文件。

defaults:
  model: deepseek-v4-pro
  max_tokens: 2048

service:
  host: 127.0.0.1
  port: 8000
  api_keys: []            # 例: ["sk-local-gateway"]，为空表示不启用鉴权

retry:
  max_retries: 2          # 每条路由的额外重试次数（指数退避）
  base_delay_seconds: 0.5
  max_delay_seconds: 4
  attempt_timeout_seconds: 60

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 10

circuit_breaker:
  failure_threshold: 3    # 连续失败 N 次后熔断该 provider
  cooldown_seconds: 20

structured_output:
  max_repair_attempts: 1  # 本地校验失败后的修复循环次数

# Prompt 注入防护（纵深防御，两道防线可独立关闭）
security:
  wrap_untrusted_variables: true   # 模板变量值用 <untrusted_data> 标签定界包裹
  leak_scan_enabled: true          # 输出侧扫描 system 提示词泄漏，命中返回 403
  leak_scan_fragment_length: 24    # 泄漏判定的片段长度（字符）

database_url: data/usage.db
prompts_dir: prompts

# 三种上游协议，验证适配器层的协议差异
providers:
  deepseek-responses:
    protocol: openai-responses        # OpenAI Responses API 协议
    base_url: https://api.deepseek.com
    api_key: ${DEEPSEEK_API_KEY}
  deepseek-chat:
    protocol: openai-chat             # DeepSeek Chat Completions 兼容协议
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
  anthropic:
    protocol: anthropic-messages      # Anthropic Messages API 协议
    base_url: https://api.anthropic.com
    api_key: ${ANTHROPIC_API_KEY}

# 模型别名 -> 候选路由（按顺序 fallback；weighted_random 按权重负载均衡）
models:
  deepseek-v4-pro:
    strategy: priority
    routes:
      - { provider: deepseek-responses, model: deepseek-v4-pro, weight: 3 }
      - { provider: anthropic, model: claude-sonnet-4-5, weight: 1 }   # 备用路由
  deepseek-v4-flash:
    strategy: priority
    routes:
      - { provider: deepseek-chat, model: deepseek-v4-flash, weight: 1 }
  balanced:
    strategy: weighted_random
    routes:
      - { provider: deepseek-chat, model: deepseek-v4-flash, weight: 3 }
      - { provider: anthropic, model: claude-sonnet-4-5, weight: 1 }

# 单价（美元 / 每百万 token，演示用估值）
pricing:
  deepseek-v4-pro: { input_per_million: 4, output_per_million: 16 }
  deepseek-v4-flash: { input_per_million: 0.5, output_per_million: 2 }
  claude-sonnet-4-5: { input_per_million: 3, output_per_million: 15 }
