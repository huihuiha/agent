[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-unify"
version = "1.0.0"
description = "统一 LLM 模型调用服务：多协议适配 / 流式 / 结构化输出 / Prompt 版本管理 / 可观测性"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
llm-unify = "llm_unify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_unify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["docs"]  # 文档配图生成脚本，非项目运行代码

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
